<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">PYNQ-Z2 PS UDP server comparison</title>
  <desc id="desc">A host PC runs the same UDP benchmark against either a Python per-packet server or a C server batching up to 32 datagrams with recvmmsg and sendmmsg. Both servers run on the PYNQ-Z2 ARM processing system and use the built-in Ethernet jack and PS GEM controller.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#263238"/>
    </marker>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: bold 25px sans-serif; fill: #17202a; }
      .head { font: bold 18px sans-serif; fill: #17202a; }
      .label { font: 16px sans-serif; fill: #17202a; }
      .small { font: 14px sans-serif; fill: #455a64; }
      .box { fill: #fff; stroke: #455a64; stroke-width: 2; rx: 8; }
      .board { fill: #e8f1fb; stroke: #1565c0; stroke-width: 2; rx: 12; }
      .ps { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 8; }
      .base { fill: #fff8e1; stroke: #ef6c00; stroke-width: 2; rx: 8; }
      .fast { fill: #e0f2f1; stroke: #00897b; stroke-width: 2; rx: 8; }
      .arrow { stroke: #263238; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="660"/>
  <text class="title" x="550" y="42" text-anchor="middle">PS-vs-PS UDP echo performance comparison</text>

  <rect class="box" x="35" y="220" width="245" height="190"/>
  <text class="head" x="157" y="256" text-anchor="middle">Host PC</text>
  <text class="label" x="157" y="294" text-anchor="middle">Same Python benchmark</text>
  <text class="label" x="157" y="325" text-anchor="middle">Sequence + integrity check</text>
  <text class="label" x="157" y="356" text-anchor="middle">Goodput, loss, RTT</text>
  <text class="small" x="157" y="386" text-anchor="middle">Run each server in turn</text>

  <rect class="board" x="340" y="90" width="720" height="500"/>
  <text class="head" x="700" y="128" text-anchor="middle">TUL PYNQ-Z2 development board</text>
  <rect class="box" x="380" y="200" width="160" height="120"/>
  <text class="head" x="460" y="237" text-anchor="middle">Built-in RJ45</text>
  <text class="label" x="460" y="269" text-anchor="middle">RTL8211E PHY</text>
  <text class="small" x="460" y="296" text-anchor="middle">PS-connected</text>

  <rect class="ps" x="595" y="160" width="425" height="390"/>
  <text class="head" x="807" y="197" text-anchor="middle">Zynq PS GEM + ARM Linux</text>
  <text class="small" x="807" y="224" text-anchor="middle">Same NIC, kernel, IP stack and board for both runs</text>
  <rect class="base" x="650" y="255" width="315" height="100"/>
  <text class="head" x="807" y="289" text-anchor="middle">Baseline: Python UDP echo</text>
  <text class="label" x="807" y="321" text-anchor="middle">recvfrom() + sendto() per datagram</text>
  <rect class="fast" x="650" y="390" width="315" height="112"/>
  <text class="head" x="807" y="425" text-anchor="middle">Candidate: C batched UDP echo</text>
  <text class="label" x="807" y="457" text-anchor="middle">recvmmsg() + sendmmsg(), batch up to 32</text>
  <text class="small" x="807" y="482" text-anchor="middle">Fewer user/kernel transitions (hypothesis)</text>

  <path class="arrow" d="M280 300 L380 260"/>
  <text class="small" x="328" y="260" text-anchor="middle">Ethernet cable</text>
  <path class="arrow" d="M540 260 L595 260"/>
  <text class="small" x="567" y="241" text-anchor="middle">MIO</text>
  <path class="arrow" d="M540 260 C565 260 570 440 650 440"/>
  <text class="small" x="570" y="388" text-anchor="middle">same PS path</text>

  <text class="small" x="550" y="625" text-anchor="middle">PL / Vivado is not part of this experiment. Compare only measured, repeated board results.</text>
</svg>
